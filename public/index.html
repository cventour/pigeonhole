<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeonhole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#1b1e21;--panel-hi:#24282c;--panel-lo:#141618;--rail:#0f1113;
  --steel:#c8ced4;--steel-dim:#a4acb3;--steel-faint:#949ca3;
  --rule:#343a40;--rule-hi:#464e56;
  --signal:#ff6a1f;--signal-dim:#a8461a;
  --chassis:#262b30;--chassis-face:#2d3339;--ink:#e8edf1;
  --danger:#e5484d;
  --gut:clamp(16px,4vw,44px);
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,sans-serif;
  --narrow:"Archivo Narrow","Archivo",system-ui,sans-serif;
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:#e6e9ec;--panel-hi:#f2f4f6;--panel-lo:#d5dade;--rail:#c3cad0;
    --steel:#1f2529;--steel-dim:#4c555c;--steel-faint:#565f67;
    --rule:#b3bcc3;--rule-hi:#98a3ab;--chassis:#d3d9de;--chassis-face:#dde2e6;
    --ink:#12171a;--signal:#c8430c;--signal-dim:#8f3209;--danger:#c62a2f;
    color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--signal);color:#0d0f11}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--rail)}
::-webkit-scrollbar-thumb{background:var(--rule-hi);border:2px solid var(--rail)}
*{scrollbar-color:var(--rule-hi) var(--rail);scrollbar-width:thin}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
header{padding:clamp(28px,5vw,48px) 0 20px}
h1{font-family:var(--narrow);font-weight:700;margin:0;text-transform:uppercase;
  font-size:clamp(1.6rem,4vw,2.5rem);line-height:1;letter-spacing:-.02em}
.sub{color:var(--steel-dim);margin:10px 0 0;font-size:.95rem}

/* --- toolbar --- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:22px 0 0;padding:14px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:180px;
  font-family:var(--mono);font-size:.82rem}
.crumbs button{background:none;border:0;color:var(--steel-dim);cursor:pointer;
  font:inherit;padding:2px 4px}
.crumbs button:hover{color:var(--signal);text-decoration:underline}
.crumbs span{color:var(--steel-faint)}
.crumbs b{color:var(--ink);font-weight:700;padding:2px 4px}

button.act{font-family:var(--mono);font-size:.8rem;letter-spacing:.03em;
  background:var(--chassis);color:var(--ink);border:1px solid var(--rule-hi);
  padding:8px 14px;cursor:pointer;transition:background .14s ease-out,border-color .14s ease-out}
button.act:hover{background:var(--panel-hi);border-color:var(--steel-faint)}
button.act.primary{border-color:var(--signal-dim);color:var(--signal)}
button.act.primary:hover{background:var(--signal);color:#0d0f11;border-color:var(--signal)}

/* --- drop zone --- */
.drop{border:1px dashed var(--rule-hi);background:var(--panel-lo);
  padding:clamp(26px,5vw,44px) 20px;text-align:center;margin:20px 0;
  transition:border-color .14s ease-out,background .14s ease-out}
.drop.over{border-color:var(--signal);background:var(--panel-hi);border-style:solid}
.drop p{margin:0;color:var(--steel-dim);font-size:.95rem}
.drop strong{color:var(--ink);font-weight:600}
.drop small{display:block;margin-top:6px;color:var(--steel-faint);
  font-family:var(--mono);font-size:.76rem}

/* --- uploads in flight --- */
.queue{border:1px solid var(--rule);background:var(--panel-lo);margin-bottom:20px}
.queue:empty{display:none}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 14px;
  padding:12px 16px;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:0}
.q-name{font-family:var(--mono);font-size:.82rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-pct{font-family:var(--mono);font-size:.8rem;color:var(--steel-dim);
  font-variant-numeric:tabular-nums}
.q-bar{grid-column:1/-1;height:3px;background:var(--rail);overflow:hidden}
.q-bar i{display:block;height:100%;width:0;background:var(--signal);
  transition:width .2s linear}
.q.done .q-bar i{background:var(--steel-faint)}
.q.err .q-pct{color:var(--danger)}
.q.err .q-bar i{background:var(--danger);width:100%}
.q-retry{grid-column:1/-1;justify-self:start;margin-top:8px;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;
  text-transform:uppercase;background:none;color:var(--signal);cursor:pointer;
  border:1px solid var(--signal-dim);padding:5px 12px}
.q-retry:hover{background:var(--signal);color:#0d0f11;border-color:var(--signal)}

/* --- listing --- */
.tablewrap{border:1px solid var(--rule);background:var(--panel-lo);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-family:var(--mono);font-weight:500;font-size:.75rem;
  letter-spacing:.05em;text-transform:uppercase;color:var(--steel-faint);
  padding:11px 16px;border-bottom:1px solid var(--rule)}
td{padding:11px 16px;border-bottom:1px solid var(--rule);font-size:.88rem;
  color:var(--steel-dim);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel)}
.nm{font-family:var(--mono);color:var(--ink);cursor:default;
  display:flex;align-items:center;gap:10px}
.nm.link{cursor:pointer}
.nm.link:hover{color:var(--signal)}
.ic{flex:0 0 14px;height:14px;opacity:.75}
.sz,.dt{font-family:var(--mono);font-size:.8rem;color:var(--steel-dim);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.row-act{display:flex;gap:2px;justify-content:flex-end}
.row-act button{position:relative;display:grid;place-items:center;width:30px;height:30px;
  padding:0;background:none;border:1px solid transparent;color:var(--steel-faint);cursor:pointer}
.row-act svg{width:15px;height:15px}
.row-act button:hover,.row-act button:focus-visible{color:var(--ink);border-color:var(--rule-hi)}
.row-act button.del:hover,.row-act button.del:focus-visible{color:var(--danger);border-color:var(--danger)}
/* The label, shown on hover or keyboard focus. Drawn by CSS rather than the
   title attribute, which waits about a second and cannot be styled. */
.row-act button::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 6px);
  right:0;white-space:nowrap;pointer-events:none;z-index:2;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;color:var(--ink);
  background:var(--panel-hi);border:1px solid var(--rule-hi);padding:3px 8px;
  opacity:0;transform:translateY(2px);transition:opacity .12s ease-out,transform .12s ease-out}
.row-act button:hover::after,.row-act button:focus-visible::after{opacity:1;transform:none}
th.ck,td.ck{width:1%;padding-right:0}
th button.sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
th button.sort:hover,th[aria-sort] button.sort{color:var(--ink)}
th button.sort:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
th button.sort::after{content:"";width:8px;text-align:center;color:var(--signal)}
th[aria-sort="ascending"] button.sort::after{content:"\25B4"}
th[aria-sort="descending"] button.sort::after{content:"\25BE"}
.ck input{margin:0;width:15px;height:15px;accent-color:var(--signal);cursor:pointer;
  vertical-align:middle}
tbody tr.sel td{background:var(--panel)}
tbody tr.sel .nm{color:var(--signal)}
button.act[hidden]{display:none}

.empty{padding:38px 16px;text-align:center;color:var(--steel-faint);
  font-family:var(--mono);font-size:.85rem}
.msg{margin:14px 0 0;padding:11px 16px;border:1px solid var(--rule-hi);
  background:var(--panel-lo);font-family:var(--mono);font-size:.82rem;
  color:var(--steel-dim)}
.msg.err{border-color:var(--danger);color:var(--danger)}
.msg:empty{display:none}

/* --- modals --- */
/* Native <dialog>: focus trap, Escape and backdrop come from the browser,
   which is a lot of correct behaviour for no dependency. */
dialog{
  /* A 2px edge, not a hairline under a soft glow: in this interface a modal
     is a panel front, and it should read as one thing sitting on top rather
     than a card floating over a blur. */
  border:2px solid var(--rule-hi);background:var(--panel-lo);color:var(--ink);
  padding:0;max-width:min(440px,calc(100vw - 32px));width:100%;
  box-shadow:0 8px 14px -8px rgba(0,0,0,.9),
             0 1px 0 0 var(--panel-hi) inset;
}
dialog::backdrop{background:rgba(6,8,10,.72)}
.dlg-body{padding:22px clamp(18px,3vw,26px) 0}
.dlg-body h2{font-family:var(--narrow);font-weight:700;text-transform:uppercase;
  font-size:1.12rem;letter-spacing:.02em;margin:0 0 10px}
.dlg-body p{margin:0;color:var(--steel-dim);font-size:.92rem}
.dlg-body p b{color:var(--ink);font-family:var(--mono);font-size:.88rem;
  font-weight:500;word-break:break-all}
.dlg-body .warn{margin-top:10px;color:var(--steel-faint);font-size:.85rem}
.dlg-body input{width:100%;margin-top:14px;padding:10px 12px;
  font-family:var(--mono);font-size:.9rem;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule-hi)}
.dlg-body input:focus{outline:none;border-color:var(--signal)}
.dlg-all{display:flex;align-items:center;gap:9px;margin-top:16px;
  font-family:var(--mono);font-size:.8rem;color:var(--steel-dim);cursor:pointer}
.dlg-all input{width:auto;margin:0;accent-color:var(--signal)}
.dlg-foot{flex-wrap:wrap}
.dlg-err{margin-top:10px;color:var(--danger);font-family:var(--mono);
  font-size:.8rem;min-height:1.2em}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;
  padding:18px clamp(18px,3vw,26px) 20px}
.dlg-foot button{font-family:var(--mono);font-size:.8rem;letter-spacing:.03em;
  padding:9px 16px;cursor:pointer;border:1px solid var(--rule-hi);
  background:var(--chassis);color:var(--ink);
  transition:background .14s ease-out,border-color .14s ease-out}
.dlg-foot button:hover{background:var(--panel-hi);border-color:var(--steel-faint)}
.dlg-foot button.go{border-color:var(--signal-dim);color:var(--signal)}
.dlg-foot button.go:hover{background:var(--signal);color:#0d0f11;border-color:var(--signal)}
.dlg-foot button.danger{border-color:var(--danger);color:var(--danger)}
.dlg-foot button.danger:hover{background:var(--danger);color:#0d0f11;border-color:var(--danger)}

/* --- settings dialog --- */
dialog.wide{max-width:min(500px,calc(100vw - 32px))}
.set-sw{display:flex;align-items:center;gap:10px;margin:0;cursor:pointer;
  font-family:var(--mono);font-size:.84rem;color:var(--ink)}
.dlg-body .set-sw input,.dlg-body .set-opt input{width:auto;margin:0;accent-color:var(--signal)}
.set-sec{margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.set-sec .hint{margin:6px 0 0 26px;color:var(--steel-faint);font-size:.82rem}
.set-grid{display:grid;grid-template-columns:1fr 92px;gap:0 12px;margin-top:14px}
.set-grid label,.set-two label{display:block;font-family:var(--mono);font-size:.72rem;
  letter-spacing:.05em;text-transform:uppercase;color:var(--steel-faint)}
.set-grid input,.set-two input{margin-top:6px!important}
.set-two{display:grid;grid-template-columns:1fr 140px;gap:0 12px;margin-top:12px}
.set-opt{display:flex;align-items:flex-start;gap:10px;margin-top:16px;cursor:pointer;
  font-family:var(--mono);font-size:.8rem;color:var(--steel-dim)}
.set-opt input{margin-top:3px!important}
.set-test{display:flex;align-items:center;gap:14px;margin-top:18px}
.set-test button{font-family:var(--mono);font-size:.78rem;letter-spacing:.03em;padding:8px 14px;
  cursor:pointer;border:1px solid var(--rule-hi);background:var(--chassis);color:var(--ink);
  flex:none;transition:background .14s ease-out,border-color .14s ease-out}
.set-test button:hover:not(:disabled){background:var(--panel-hi);border-color:var(--steel-faint)}
.set-test button:disabled{opacity:.55;cursor:default}
.set-result{font-family:var(--mono);font-size:.78rem;color:var(--steel-dim);min-width:0;
  overflow-wrap:anywhere}
.set-result.ok{color:var(--ink)}
.set-result.ok::before{content:"\25CF  ";color:#3fb950}
.set-result.bad{color:var(--danger)}
.set-result.bad::before{content:"\25CF  "}

footer{border-top:1px solid var(--rule);margin-top:34px;padding:20px 0 40px;
  font-family:var(--mono);font-size:.76rem;color:var(--steel-faint);
  display:flex;flex-wrap:wrap;gap:8px 24px}
footer a{color:var(--steel-dim)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="title">Pigeonhole</h1>
    <p class="sub" id="subtitle">Drop files in. Take files out.</p>
  </header>

  <div class="bar">
    <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
    <button class="act" id="btn-dl" hidden></button>
    <button class="act" id="btn-settings">Settings</button>
    <button class="act" id="btn-mkdir">New folder</button>
    <button class="act primary" id="btn-pick">Upload files</button>
    <input type="file" id="picker" multiple hidden>
  </div>

  <div class="drop" id="drop">
    <p><strong>Drop files here</strong> to upload to this folder</p>
    <small id="drop-target"></small>
  </div>

  <div class="queue" id="queue"></div>
  <p class="msg" id="msg" role="status"></p>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th class="ck"><input type="checkbox" id="sel-all" aria-label="Select all"></th>
        <th style="width:52%" data-k="name"><button class="sort">Name</button></th>
        <th data-k="size"><button class="sort">Size</button></th>
        <th data-k="mtime"><button class="sort">Modified</button></th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <span id="rootname"></span>
    <span id="scanstate"></span>
    <span>no authentication — trusted networks only</span>
    <span><a href="https://github.com/cventour/pigeonhole">pigeonhole</a></span>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-body">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <p class="warn" id="dlg-warn" hidden></p>
      <input id="dlg-input" hidden autocomplete="off" spellcheck="false">
      <label class="dlg-all" id="dlg-all" hidden>
        <input type="checkbox" id="dlg-all-box"> <span id="dlg-all-label"></span>
      </label>
      <div class="dlg-err" id="dlg-err"></div>
    </div>
    <div class="dlg-foot" id="dlg-foot"></div>
  </form>
</dialog>

<dialog id="settings" class="wide">
  <form id="settings-form" novalidate>
    <div class="dlg-body">
      <h2>Settings</h2>
      <p>Uploads are checked by an ICAP server before they appear in the listing.</p>

      <div class="set-sec">
        <label class="set-sw"><input type="checkbox" id="s-enabled"> Scan uploads with an ICAP server</label>
        <div class="set-grid">
          <div><label for="s-host">Server</label>
            <input id="s-host" autocomplete="off" spellcheck="false" placeholder="icap.example.net"></div>
          <div><label for="s-port">Port</label>
            <input id="s-port" inputmode="numeric" autocomplete="off" placeholder="1344"></div>
        </div>
        <div class="set-two">
          <div><label for="s-service">Service</label>
            <input id="s-service" autocomplete="off" spellcheck="false" placeholder="omsscan"></div>
          <div><label for="s-timeout">Timeout (s)</label>
            <input id="s-timeout" inputmode="numeric" autocomplete="off" placeholder="120"></div>
        </div>
        <label class="set-opt"><input type="checkbox" id="s-closed">
          <span>Reject the upload if the scanner cannot be reached or cannot scan</span></label>
        <div class="set-test">
          <button type="button" id="s-test">Test connection</button>
          <span class="set-result" id="s-result" role="status"></span>
        </div>
      </div>
      <div class="dlg-err" id="s-err"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" id="s-cancel">Cancel</button>
      <button type="submit" class="go" id="s-save">Save</button>
    </div>
  </form>
</dialog>

<!-- Zip downloads go out as a plain form POST, so the browser handles the
     download natively instead of the page buffering the archive. -->
<form id="zipform" method="post" hidden></form>

<script>
// Every request is relative, so this page works from whatever URL it is served at.
const api = (p) => new URL(p, location.href.endsWith('/') ? location.href : location.href + '/').toString();
let cwd = '/';

const $ = (id) => document.getElementById(id);
const rows = $('rows'), crumbs = $('crumbs'), queue = $('queue'), msg = $('msg');

const ICON = {
  dir: '<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 4.2h4l1.3 1.6h7.7v7.7h-13z"/></svg>',
  file:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.3 1.8h6l3.4 3.4v9h-9.4z"/><path d="M9.3 1.8v3.5h3.4"/></svg>',
  dl:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2.5v8"/><path d="M4.5 7 8 10.5 11.5 7"/><path d="M2.5 13.5h11"/></svg>',
  wg:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3.5 6 8l-4 4.5"/><path d="M8.5 12.5h5.5"/></svg>',
  rn:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.6 2.6l2.8 2.8-7.9 7.9H2.7v-2.8z"/><path d="M9.2 4l2.8 2.8"/></svg>',
  del: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.3h11"/><path d="M6.2 4.3V2.6h3.6v1.7"/><path d="M3.9 4.3l.7 9.1h6.8l.7-9.1"/><path d="M6.7 6.8v4.2M9.3 6.8v4.2"/></svg>',
  up:  '<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 12.5V4"/><path d="M4.3 7.6 8 3.9l3.7 3.7"/></svg>',
};

const fmtSize = (n) => {
  if (n === null || n === undefined) return '';
  const u = ['B','KB','MB','GB','TB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + ' ' + u[i];
};
const fmtDate = (ms) => new Date(ms).toLocaleString(undefined,
  { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });

// One dialog, reused. Resolves to the chosen button's value (null when
// cancelled), or the typed string when the dialog has an input.
const dlg = $('dlg');
function ask({ title, text, warn, input, okLabel, danger, validate,
               buttons, applyAll }) {
  $('dlg-title').textContent = title;
  $('dlg-text').innerHTML = '';
  $('dlg-text').append(...text);
  const w = $('dlg-warn');
  w.hidden = !warn; w.textContent = warn || '';
  const i = $('dlg-input');
  i.hidden = !input;
  i.value = input?.value ?? '';
  const all = $('dlg-all');
  all.hidden = !applyAll;
  $('dlg-all-box').checked = false;
  if (applyAll) $('dlg-all-label').textContent = applyAll;

  const err = $('dlg-err'); err.textContent = '';

  const spec = buttons || [
    { value: 'cancel', label: 'Cancel' },
    { value: 'ok', label: okLabel, cls: danger ? 'danger' : 'go' },
  ];
  const foot = $('dlg-foot');
  foot.innerHTML = '';
  let submitBtn = null;
  for (const b of spec) {
    const el = document.createElement('button');
    el.value = b.value; el.textContent = b.label;
    if (b.cls) el.className = b.cls;
    foot.append(el);
    if (b.value !== 'cancel' && !submitBtn) submitBtn = el;
  }

  return new Promise((resolve) => {
    const guard = (e) => {
      if (!input) return;                       // confirm-only: let it close
      const v = i.value.trim();
      const problem = validate ? validate(v) : (v ? null : 'Enter a name');
      if (problem) { e.preventDefault(); err.textContent = problem; i.focus(); }
    };
    submitBtn?.addEventListener('click', guard);
    dlg.addEventListener('close', () => {
      submitBtn?.removeEventListener('click', guard);
      const v = dlg.returnValue;
      const chose = v && v !== 'cancel';
      resolve(chose
        ? (input ? i.value.trim() : { action: v, all: $('dlg-all-box').checked })
        : null);
    }, { once: true });

    dlg.showModal();
    if (input) { i.focus(); i.select(); } else { foot.querySelector('button')?.focus(); }
  });
}

const nameRules = (v) => {
  if (!v) return 'Enter a name';
  if (v.includes('/') || v.includes('\\')) return 'A name cannot contain / or \\';
  if (v === '.' || v === '..') return 'That name is not allowed';
  return null;
};

function say(text, isErr) {
  msg.textContent = text || '';
  msg.className = 'msg' + (isErr ? ' err' : '');
  if (text && !isErr) setTimeout(() => { if (msg.textContent === text) say(''); }, 4000);
}

function drawCrumbs() {
  const parts = cwd.split('/').filter(Boolean);
  crumbs.innerHTML = '';
  const root = document.createElement('button');
  root.textContent = 'repos'; root.onclick = () => go('/');
  crumbs.append(root);
  let acc = '';
  parts.forEach((p, i) => {
    const sep = document.createElement('span'); sep.textContent = '/';
    crumbs.append(sep);
    acc += '/' + p;
    if (i === parts.length - 1) {
      const b = document.createElement('b'); b.textContent = p; crumbs.append(b);
    } else {
      const here = acc;
      const btn = document.createElement('button');
      btn.textContent = p; btn.onclick = () => go(here);
      crumbs.append(btn);
    }
  });
  $('drop-target').textContent = cwd;
}

async function go(dir) { cwd = dir || '/'; selected.clear(); await refresh(); }

// --- selection and download ------------------------------------------------
// Paths of the ticked rows in this folder. A single file downloads as itself;
// a folder, or more than one of anything, arrives as one zip.
const selected = new Set();
let shown = [];            // [{ full, dir, tr }] in display order, for ranges
let anchor = null;         // last row clicked, for shift-click ranges

const fileUrl = (full) => api('api/download' + full.split('/').map(encodeURIComponent).join('/'));

function download(paths) {
  const one = shown.find(r => r.full === paths[0]);
  if (paths.length === 1 && one && !one.dir) { location.href = fileUrl(paths[0]); return; }
  const f = $('zipform');
  f.action = api('api/zip');
  f.innerHTML = '';
  for (const [k, v] of [['dir', cwd], ...paths.map(p => ['path', p])]) {
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = v;
    f.append(i);
  }
  f.submit();
}

// A wget line for a file, to run on another machine. -O pins the saved name,
// since wget would otherwise take it from the URL. The page's own address is
// used, so it only works for a host that can reach this server by that name.
const shq = (v) => "'" + v.replace(/'/g, "'\\''") + "'";

async function copyWget(full, name) {
  const cmd = `wget -O ${shq(name)} ${shq(fileUrl(full))}`;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(cmd);
    else {
      // Plain http on a LAN address is not a secure context, so there is no
      // clipboard API; fall back to copying from a throwaway textarea.
      const ta = document.createElement('textarea');
      ta.value = cmd; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('copy blocked');
    }
  } catch { say('Could not copy to the clipboard.', true); return; }
  const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  say(local ? 'Copied, but this page is open as ' + location.hostname + ', which another machine cannot reach. Open it by the server\'s network address first.'
            : 'Copied wget command for ' + name);
}

function drawSelection() {
  for (const r of shown) {
    r.tr.classList.toggle('sel', selected.has(r.full));
    r.tr.querySelector('.ck input').checked = selected.has(r.full);
  }
  const all = $('sel-all');
  all.checked = shown.length > 0 && selected.size === shown.length;
  all.indeterminate = selected.size > 0 && selected.size < shown.length;
  all.disabled = !shown.length;
  const b = $('btn-dl');
  b.hidden = !selected.size;
  const zipped = selected.size > 1 || shown.some(r => r.dir && selected.has(r.full));
  b.textContent = `Download ${selected.size} selected` + (zipped ? ' as zip' : '');
}

function toggle(full, on, shift) {
  const i = shown.findIndex(r => r.full === full);
  const a = shown.findIndex(r => r.full === anchor);
  if (shift && a !== -1) {
    const [lo, hi] = i < a ? [i, a] : [a, i];
    for (const r of shown.slice(lo, hi + 1)) on ? selected.add(r.full) : selected.delete(r.full);
  } else {
    on ? selected.add(full) : selected.delete(full);
  }
  anchor = full;
  drawSelection();
}

$('sel-all').onchange = (e) => {
  selected.clear();
  if (e.target.checked) shown.forEach(r => selected.add(r.full));
  drawSelection();
};
$('btn-dl').onclick = () => download(shown.map(r => r.full).filter(f => selected.has(f)));

// A 5xx with an empty body — the server restarting mid-request, say — makes
// response.json() fail with "Unexpected end of JSON input", which tells the
// reader nothing about what happened or what to do.
async function asJson(r) {
  const text = await r.text();
  if (!text) {
    throw new Error(r.status >= 500
      ? `The server did not respond (HTTP ${r.status}). It may be restarting — try again in a moment.`
      : `Empty response (HTTP ${r.status})`);
  }
  try { return JSON.parse(text); }
  catch { throw new Error(`Unexpected response (HTTP ${r.status})`); }
}

// --- sorting ---------------------------------------------------------------
// Folders stay above files whatever the order, the way both Explorer and a
// person scanning for a folder expect. Folders have no size, so under Size
// they fall back to name order. Remembered per browser, not per folder.
let sort = { key: 'name', dir: 1 };
try { Object.assign(sort, JSON.parse(localStorage.getItem('pigeonhole.sort')) || {}); } catch {}
// A first click on Size or Modified wants the biggest or newest first.
const FIRST_DIR = { name: 1, size: -1, mtime: -1 };
let items = [];

function sorted(list) {
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  const cmp = sort.key === 'name' ? byName
    : (a, b) => ((a[sort.key] ?? 0) - (b[sort.key] ?? 0)) || byName(a, b);
  return [...list].sort((a, b) => (b.dir - a.dir)
    || (a.dir && sort.key === 'size' ? byName(a, b) : cmp(a, b) * sort.dir));
}

function drawSortHeads() {
  for (const th of document.querySelectorAll('th[data-k]')) {
    if (th.dataset.k === sort.key) th.setAttribute('aria-sort', sort.dir > 0 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  }
}

for (const th of document.querySelectorAll('th[data-k]')) {
  th.querySelector('button').onclick = () => {
    const k = th.dataset.k;
    sort = k === sort.key ? { key: k, dir: -sort.dir } : { key: k, dir: FIRST_DIR[k] };
    try { localStorage.setItem('pigeonhole.sort', JSON.stringify(sort)); } catch {}
    render();
  };
}

async function refresh() {
  drawCrumbs();
  let data;
  try {
    const r = await fetch(api('api/list?dir=' + encodeURIComponent(cwd)));
    data = await asJson(r);
    if (!r.ok) throw new Error(data.error || r.statusText);
  } catch (e) {
    rows.innerHTML = ''; shown = []; drawSelection();
    say('Could not list this folder: ' + e.message, true); return;
  }
  items = data.items;
  render();
}

// Redraws from the last listing, so re-sorting does not go back to the server.
function render() {
  drawSortHeads();
  rows.innerHTML = '';
  shown = [];

  if (cwd !== '/') {
    const tr = document.createElement('tr');
    const up = cwd.split('/').slice(0, -1).join('/') || '/';
    tr.innerHTML = `<td class="ck"></td><td><span class="nm link">${ICON.up}..</span></td><td></td><td></td><td></td>`;
    tr.querySelector('.nm').onclick = () => go(up);
    rows.append(tr);
  }

  if (!items.length && cwd === '/') {
    rows.innerHTML = '<tr><td colspan="5" class="empty">Empty. Drop files above to upload.</td></tr>';
    selected.clear(); drawSelection();
    return;
  }

  for (const it of sorted(items)) {
    const full = (cwd === '/' ? '' : cwd) + '/' + it.name;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ck"><input type="checkbox"></td>
      <td><span class="nm${it.dir ? ' link' : ''}">${it.dir ? ICON.dir : ICON.file}<span class="t"></span></span></td>
      <td class="sz">${fmtSize(it.size)}</td>
      <td class="dt">${fmtDate(it.mtime)}</td>
      <td><div class="row-act">
        <button data-a="dl" aria-label="${it.dir ? 'Download as zip' : 'Download'}">${ICON.dl}</button>
        ${it.dir ? '' : `<button data-a="wg" aria-label="Copy wget command">${ICON.wg}</button>`}
        <button data-a="rn" aria-label="Rename">${ICON.rn}</button>
        <button data-a="del" class="del" aria-label="Delete">${ICON.del}</button>
      </div></td>`;
    tr.querySelector('.t').textContent = it.name;   // never innerHTML a filename
    if (it.dir) tr.querySelector('.nm').onclick = () => go(full);
    const box = tr.querySelector('.ck input');
    box.setAttribute('aria-label', 'Select ' + it.name);
    // Read shiftKey on click: change events do not carry it.
    box.onclick = (e) => toggle(full, box.checked, e.shiftKey);
    tr.querySelector('[data-a="dl"]').onclick = () => download([full]);
    const wg = tr.querySelector('[data-a="wg"]');
    if (wg) wg.onclick = () => copyWget(full, it.name);
    tr.querySelector('[data-a="rn"]').onclick = () => rename(full, it.name);
    tr.querySelector('[data-a="del"]').onclick = () => remove(full, it.name, it.dir);
    rows.append(tr);
    shown.push({ full, dir: it.dir, tr });
  }
  // Keep ticks across a refresh (after a rename or upload), minus what is gone.
  for (const f of [...selected]) if (!shown.some(r => r.full === f)) selected.delete(f);
  drawSelection();
}

async function post(route, body) {
  const r = await fetch(api('api/' + route), {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await asJson(r);
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const strong = (t) => { const b = document.createElement('b'); b.textContent = t; return b; };
const txt = (t) => document.createTextNode(t);

async function rename(target, current) {
  const name = await ask({
    title: 'Rename',
    text: [txt('Renaming '), strong(current)],
    input: { value: current },
    okLabel: 'Rename',
    validate: nameRules,
  });
  if (name === null || name === current) return;
  try { await post('rename', { target, name }); say('Renamed to ' + name); refresh(); }
  catch (e) { say(e.message, true); }
}

async function remove(target, name, isDir) {
  const confirmed = await ask({
    title: isDir ? 'Delete folder' : 'Delete file',
    text: [txt('Delete '), strong(name), txt('?')],
    warn: isDir
      ? 'Everything inside it goes too. This cannot be undone.'
      : 'This cannot be undone.',
    okLabel: 'Delete',
    danger: true,
  });
  if (!confirmed) return;
  try { await post('delete', { target }); say('Deleted ' + name); refresh(); }
  catch (e) { say(e.message, true); }
}

$('btn-mkdir').onclick = async () => {
  const name = await ask({
    title: 'New folder',
    text: [txt('Created inside '), strong(cwd)],
    input: { value: '' },
    okLabel: 'Create',
    validate: nameRules,
  });
  if (name === null) return;
  try { await post('mkdir', { dir: cwd, name }); say('Created ' + name); refresh(); }
  catch (e) { say(e.message, true); }
};

// --- settings --------------------------------------------------------------
// The server owns the settings; this reads them when the dialog opens and
// sends them back whole on Save. `scanOn` only decides whether an upload that
// has finished sending says "scanning" while it waits for the verdict.
let scanOn = false;

function drawScanState(c) {
  scanOn = !!(c && c.enabled);
  $('scanstate').textContent = scanOn ? `scanning uploads via icap://${c.host}:${c.port}` : '';
}

const settingsDlg = $('settings');
const sv = (id) => $(id).value.trim();
const formIcap = () => ({
  enabled: $('s-enabled').checked, host: sv('s-host'),
  port: sv('s-port') === '' ? 1344 : Number(sv('s-port')),
  service: sv('s-service') || 'omsscan',
  timeout: sv('s-timeout') === '' ? 120 : Number(sv('s-timeout')),
  failClosed: $('s-closed').checked,
});

function showResult(text, cls) {
  const r = $('s-result'); r.textContent = text || ''; r.className = 'set-result' + (cls ? ' ' + cls : '');
}

$('btn-settings').onclick = async () => {
  $('s-err').textContent = ''; showResult('');
  let c;
  try {
    const r = await fetch(api('api/settings'));
    const j = await asJson(r);
    if (!r.ok) throw new Error(j.error || r.statusText);
    c = j.icap;
  } catch (e) { say('Could not read the settings: ' + e.message, true); return; }
  $('s-enabled').checked = c.enabled;
  $('s-host').value = c.host;
  $('s-port').value = c.port;
  $('s-service').value = c.service;
  $('s-timeout').value = c.timeout;
  $('s-closed').checked = c.failClosed;
  settingsDlg.showModal();
  $('s-host').focus();
};

$('s-cancel').onclick = () => settingsDlg.close();

$('s-test').onclick = async () => {
  const b = $('s-test'), c = formIcap();
  $('s-err').textContent = '';
  if (!c.host) { showResult('Enter the server first', 'bad'); $('s-host').focus(); return; }
  b.disabled = true; showResult('Testing…');
  try {
    const j = await post('settings/icap-test', c);
    showResult(j.ok ? `${j.server} answered and scanned a test file (${j.ms} ms)` : j.error, j.ok ? 'ok' : 'bad');
  } catch (e) { showResult(e.message, 'bad'); }
  b.disabled = false;
};

$('settings-form').onsubmit = async (e) => {
  e.preventDefault();
  const save = $('s-save'); save.disabled = true;
  try {
    const r = await fetch(api('api/settings'), {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ icap: formIcap() }),
    });
    const j = await asJson(r);
    if (!r.ok) throw new Error(j.error || r.statusText);
    drawScanState(j.icap);
    settingsDlg.close();
    say(j.icap.enabled ? 'Uploads will be scanned' : 'Settings saved. Scanning is off');
  } catch (err) { $('s-err').textContent = err.message; }
  save.disabled = false;
};

fetch(api('api/settings')).then(r => r.json()).then(j => drawScanState(j.icap)).catch(() => {});

// --- uploads ---------------------------------------------------------------
// XHR rather than fetch: fetch still cannot report upload progress, and a
// multi-gigabyte installer with no progress bar looks indistinguishable from
// a hang.
function upload(file, card, mode) {
  if (!card) {
    card = document.createElement('div');
    card.className = 'q';
    card.innerHTML = '<div class="q-name"></div><div class="q-pct">0%</div><div class="q-bar"><i></i></div>';
    card.querySelector('.q-name').textContent = file.name;
    queue.append(card);
  }
  card.className = 'q';
  if (mode) card.dataset.mode = mode;
  const pct = card.querySelector('.q-pct'), bar = card.querySelector('.q-bar i');
  bar.style.width = '0%';
  card.querySelector('.q-retry')?.remove();
  card.querySelector('.q-detail')?.remove();

  return new Promise((resolve) => {
    const dest = (cwd === '/' ? '' : cwd) + '/' + file.name;
    const q = mode ? '?mode=' + mode : '';
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', api('api/upload' + dest.split('/').map(encodeURIComponent).join('/') + q));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      pct.textContent = p + '%'; bar.style.width = p + '%';
    };
    // All bytes are with the server; what remains is the scanner's verdict.
    xhr.upload.onload = () => { if (scanOn) { pct.textContent = 'scanning…'; bar.style.width = '100%'; } };
    xhr.onload = () => {
      let j = {};
      try { j = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200) {
        card.classList.add('done');
        pct.textContent = fmtSize(file.size); bar.style.width = '100%';
        setTimeout(() => card.remove(), 2500);
        if (j.scan === 'skipped') say(`${file.name} was kept but not scanned: ${j.note}`, true);
      } else if (xhr.status === 422) {
        // A verdict, not a fault: retrying the same file cannot change it.
        fail(card, pct, j.threat ? `blocked: ${j.threat}` : 'blocked by scanner', file, false, j.reason);
      } else if (j.error === 'scan failed') {
        fail(card, pct, 'not scanned, rejected', file, true, j.detail);
      } else {
        let m = j.error || 'failed';
        if (xhr.status === 409) m = 'already exists';
        if (xhr.status >= 500) m = 'server restarting';
        fail(card, pct, m, file);
      }
      resolve();
    };
    xhr.onerror = () => { fail(card, pct, 'network error', file); resolve(); };
    xhr.send(file);
  });
}

// Three at a time. Serial wastes the link on small files; unbounded opens a
// socket per file and makes every progress bar crawl in lockstep, which reads
// as a stall. Three keeps the link busy and each bar legible.
const PARALLEL = 3;

// Nothing partial is left on the server when an upload fails — it writes to
// <name>.part and only renames on success — so retrying is always safe and
// always starts clean.
function fail(card, pct, message, file, retry = true, detail) {
  card.classList.add('err');
  pct.textContent = message;
  if (detail) {
    const d = document.createElement('div');
    d.className = 'q-pct q-detail'; d.style.gridColumn = '1/-1'; d.textContent = detail;
    card.querySelector('.q-bar').after(d);
  }
  if (!retry) return;
  const again = document.createElement('button');
  again.className = 'q-retry';
  again.textContent = 'Retry';
  again.onclick = () => upload(file, card, card.dataset.mode || undefined).then(refresh);
  card.lastElementChild.after(again);
}

async function exists(name) {
  const p = (cwd === '/' ? '' : cwd) + '/' + name;
  try {
    const r = await fetch(api('api/exists?path=' + encodeURIComponent(p)));
    return (await asJson(r)).exists;
  } catch { return false; }   // let the upload itself report the real problem
}

// Asked once per conflict, or once for all of them. Checking before sending
// means a 900 MB file is never uploaded only to be refused at the end.
async function resolveConflict(name, remaining) {
  const answer = await ask({
    title: 'File already exists',
    text: [strong(name), txt(' is already in this folder.')],
    warn: 'Replacing overwrites the copy that is there now.',
    applyAll: remaining > 1 ? `Do this for the other ${remaining - 1} too` : null,
    buttons: [
      { value: 'cancel', label: 'Skip' },
      { value: 'keep', label: 'Keep both', cls: 'go' },
      { value: 'replace', label: 'Replace', cls: 'danger' },
    ],
  });
  return answer;   // null = skip
}

async function uploadAll(files) {
  const list = [...files];

  // Resolve conflicts first, so the uploads that follow run unattended.
  const plan = [];
  let blanket = null;
  for (let n = 0; n < list.length; n++) {
    const f = list[n];
    if (!(await exists(f.name))) { plan.push({ file: f }); continue; }
    if (blanket) {
      if (blanket !== 'skip') plan.push({ file: f, mode: blanket });
      continue;
    }
    const ans = await resolveConflict(f.name, list.length - n);
    const action = ans?.action ?? 'skip';
    if (ans?.all) blanket = action;
    if (action !== 'skip') plan.push({ file: f, mode: action });
    else say(`Skipped ${f.name}`);
  }
  if (!plan.length) { refresh(); return; }

  const queue = [...plan];
  const worker = async () => {
    while (queue.length) {
      const job = queue.shift();
      await upload(job.file, null, job.mode);
    }
  };
  await Promise.all(Array.from({ length: Math.min(PARALLEL, queue.length) }, worker));
  refresh();
}

const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); if (ev === 'dragleave' && drop.contains(e.relatedTarget)) return;
  drop.classList.remove('over');
}));
drop.addEventListener('drop', (e) => {
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) uploadAll(files);
});
// The whole window accepts a drop too, so a file dropped slightly off target
// does not open in the browser and lose the page.
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  if (drop.contains(e.target)) return;
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) uploadAll(files);
});

$('btn-pick').onclick = () => $('picker').click();
$('picker').onchange = (e) => { uploadAll([...e.target.files]); e.target.value = ''; };

// Branding comes from the server so one build serves any deployment.
fetch(api('api/config')).then(r => r.json()).then(c => {
  if (c.title) { document.title = c.title; $('title').textContent = c.title; }
  if (c.subtitle) $('subtitle').textContent = c.subtitle;
  if (c.root) $('rootname').textContent = c.root;
}).catch(() => {});

refresh();
</script>
</body>
